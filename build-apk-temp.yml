name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Expo
        run: npx expo install --fix

      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Debug APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --no-parallel

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nexor-client-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Build Release APK (unsigned)
        working-directory: ./android
        run: |
          ./gradlew assembleRelease --no-daemon --no-parallel || echo "Release build failed, debug APK available"

      - name: Upload Release APK (if exists)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nexor-client-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: ignore

      - name: Build Summary
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Debug APK" >> $GITHUB_STEP_SUMMARY
          if [ -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            ls -lh android/app/build/outputs/apk/debug/app-debug.apk >> $GITHUB_STEP_SUMMARY
          else
            echo "Debug APK not found" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Release APK" >> $GITHUB_STEP_SUMMARY
          if ls android/app/build/outputs/apk/release/*.apk 1> /dev/null 2>&1; then
            ls -lh android/app/build/outputs/apk/release/*.apk >> $GITHUB_STEP_SUMMARY
          else
            echo "Release APK not found" >> $GITHUB_STEP_SUMMARY
          fi
